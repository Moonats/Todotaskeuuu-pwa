<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tugasku Pro</title>
    <link rel="manifest" href="manifest.json">
    <style>
        /* CSS Variables untuk Dark Mode */
        :root {
            --bg: #f4f4f9; --text: #333; --card: #fff; --border: #ddd; --primary: #4CAF50;
        }
        [data-theme="dark"] {
            --bg: #121212; --text: #f1f1f1; --card: #1e1e1e; --border: #333; --primary: #2E7D32;
        }
        
        body { font-family: sans-serif; background: var(--bg); color: var(--text); padding: 10px; max-width: 500px; margin: auto; transition: 0.3s; }
        h2 { text-align: center; }
        
        /* Navigasi / Tab */
        .tabs { display: flex; gap: 5px; margin-bottom: 15px; overflow-x: auto; padding-bottom: 5px; }
        .tabs button { flex: 1; padding: 10px; border: none; background: var(--card); color: var(--text); border-radius: 5px; cursor: pointer; white-space: nowrap; border: 1px solid var(--border); }
        .tabs button.active { background: var(--primary); color: white; }
        
        /* Form Input */
        .input-group { background: var(--card); padding: 15px; border-radius: 8px; border: 1px solid var(--border); margin-bottom: 15px; }
        input, select { width: 100%; padding: 8px; margin-bottom: 10px; box-sizing: border-box; border: 1px solid var(--border); background: var(--bg); color: var(--text); border-radius: 4px; }
        .btn-tambah { width: 100%; padding: 10px; background: var(--primary); color: white; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; }
        
        /* List Tugas */
        ul { list-style: none; padding: 0; }
        li { background: var(--card); margin-bottom: 10px; padding: 15px; border-radius: 8px; border: 1px solid var(--border); display: flex; flex-direction: column; gap: 10px; }
        .task-header { display: flex; justify-content: space-between; align-items: center; }
        .task-title { font-weight: bold; font-size: 16px; }
        .completed .task-title { text-decoration: line-through; opacity: 0.5; }
        .badge { font-size: 12px; padding: 3px 8px; border-radius: 12px; color: white; }
        .task-time { font-size: 12px; color: #888; }
        
        /* Tombol Aksi */
        .actions { display: flex; gap: 5px; justify-content: flex-end; }
        .btn-icon { background: none; border: 1px solid var(--border); padding: 5px 10px; border-radius: 4px; cursor: pointer; color: var(--text); }
        .btn-icon:hover { background: var(--border); }
        
        /* Settings Section */
        #settingsSection { display: none; background: var(--card); padding: 15px; border-radius: 8px; border: 1px solid var(--border); }
    </style>
</head>
<body>

    <h2>Tugasku</h2>

    <div class="tabs">
        <button id="tab-all" class="active" onclick="setFilter('all')">Semua</button>
        <button id="tab-pending" onclick="setFilter('pending')">Belum</button>
        <button id="tab-completed" onclick="setFilter('completed')">Selesai</button>
        <button id="tab-settings" onclick="showSettings()">⚙️ Setelan</button>
    </div>

    <div id="mainSection">
        <div class="input-group">
            <input type="text" id="taskInput" placeholder="Apa yang mau dikerjakan?">
            <div style="display: flex; gap: 5px;">
                <input type="datetime-local" id="taskTime">
                <select id="taskCategory"></select>
            </div>
            <button class="btn-tambah" onclick="addTask()">Tambah Tugas</button>
        </div>

        <ul id="taskList"></ul>
    </div>

    <div id="settingsSection">
        <h3>Pengaturan Aplikasi</h3>
        <label style="display: flex; align-items: center; gap: 10px; margin-bottom: 20px;">
            <input type="checkbox" id="darkModeToggle" onchange="toggleDarkMode()" style="width: auto;"> Aktifkan Dark Mode
        </label>
        
        <h4>Kategori Custom</h4>
        <div style="display: flex; gap: 5px; margin-bottom: 10px;">
            <input type="text" id="newCatName" placeholder="Nama kategori...">
            <input type="color" id="newCatColor" value="#ff0000" style="width: 50px; padding: 0;">
        </div>
        <button class="btn-tambah" onclick="addCategory()">Buat Kategori</button>
        
        <ul id="catList" style="margin-top: 15px;"></ul>
    </div>

    <script src="app.js"></script>
    <script>
        if ('serviceWorker' in navigator) { navigator.serviceWorker.register('sw.js'); }
    </script>
</body>
</html>
