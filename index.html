<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Orbit</title>
    <style>
        :root { --bg: #f4f4f9; --text: #333; --card: #fff; --border: #ddd; --primary: #0074D9; }
        [data-theme="dark"] { --bg: #000000; --text: #e0e0e0; --card: #001f3f; --border: #003366; --primary: #0074D9; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
        body { background: var(--bg); color: var(--text); padding-top: 60px; padding-bottom: 85px; transition: 0.3s; }
        
        /* HEADER (Sekarang bersih, hanya Logo) */
        header { position: fixed; top: 0; left: 0; right: 0; height: 60px; background: var(--card); border-bottom: 1px solid var(--border); display: flex; justify-content: center; align-items: center; padding: 0 20px; z-index: 10; font-size: 20px; font-weight: bold; letter-spacing: 2px; }

        /* NAVIGASI BAWAH (5 Menu) */
        nav { position: fixed; bottom: 0; left: 0; right: 0; height: 75px; background: var(--card); border-top: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; z-index: 10; padding: 0 10px; }
        .nav-item { background: none; border: none; font-size: 11px; color: var(--text); display: flex; flex-direction: column; align-items: center; cursor: pointer; opacity: 0.5; width: 20%; justify-content: center; gap: 6px; }
        .nav-item.active { opacity: 1; color: var(--primary); font-weight: bold; }
        .nav-icon { font-size: 22px; }
        
        .btn-add-float { width: 55px; height: 55px; background: var(--primary); color: white; border: none; border-radius: 50%; font-size: 30px; display: flex; justify-content: center; align-items: center; cursor: pointer; box-shadow: 0 4px 10px rgba(0,116,217,0.4); transform: translateY(-15px); }

        .container { padding: 15px; max-width: 600px; margin: auto; display: none; }
        .container.active { display: block; }
        h3 { margin: 15px 0 10px 0; font-size: 14px; opacity: 0.7; border-bottom: 1px solid var(--border); padding-bottom: 5px; text-transform: uppercase; letter-spacing: 1px; }

        /* MODAL TUGAS */
        .modal-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.6); display: none; justify-content: center; align-items: flex-end; z-index: 100; backdrop-filter: blur(2px); }
        .modal-overlay.active { display: flex; }
        .modal-content { background: var(--card); width: 100%; max-width: 600px; border-radius: 16px 16px 0 0; padding: 25px 20px; animation: slideUp 0.3s ease; max-height: 90vh; overflow-y: auto; }
        @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .close-btn { background: var(--border); border: none; width: 32px; height: 32px; border-radius: 50%; cursor: pointer; color: var(--text); font-weight: bold; }

        input, select, textarea { width: 100%; padding: 14px; margin-bottom: 15px; border: 1px solid var(--border); background: var(--bg); color: var(--text); border-radius: 8px; font-size: 15px; }
        textarea { resize: vertical; min-height: 80px; }
        .btn-main { width: 100%; padding: 15px; background: var(--primary); color: white; border: none; border-radius: 8px; font-weight: bold; font-size: 16px; cursor: pointer; }

        .icon-grid { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 15px; }
        .icon-option { width: 42px; height: 42px; display: flex; justify-content: center; align-items: center; background: var(--bg); border: 1px solid var(--border); border-radius: 8px; font-size: 20px; cursor: pointer; }
        .icon-option.selected { background: var(--primary); color: white; border-color: var(--primary); }

        .toggle-wrap { display: flex; align-items: center; gap: 15px; background: var(--bg); padding: 15px; border-radius: 8px; border: 1px solid var(--border); margin-bottom: 20px; }
        .switch { position: relative; display: inline-block; width: 50px; height: 26px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #ccc; transition: .4s; border-radius: 34px; }
        .slider:before { position: absolute; content: ""; height: 18px; width: 18px; left: 4px; bottom: 4px; background-color: white; transition: .4s; border-radius: 50%; }
        input:checked + .slider { background-color: var(--primary); }
        input:checked + .slider:before { transform: translateX(24px); }

        .task-card { background: var(--card); padding: 15px; border-radius: 12px; border: 1px solid var(--border); margin-bottom: 12px; display: flex; flex-direction: column; gap: 8px; }
        .task-header { display: flex; justify-content: space-between; align-items: flex-start; }
        .task-title { font-weight: bold; font-size: 16px; display: flex; align-items: center; gap: 10px; }
        .completed .task-title { text-decoration: line-through; opacity: 0.5; }
        .task-desc { font-size: 14px; color: #888; }
        .badge { font-size: 11px; padding: 5px 10px; border-radius: 12px; color: white; display: inline-flex; align-items: center; gap: 5px; text-transform: uppercase; letter-spacing: 0.5px; font-weight: bold; }
        .task-time { font-size: 12px; font-weight: bold; color: var(--primary); margin-top: 5px; }
        .actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 5px; flex-wrap: wrap;}
        .btn-icon { background: var(--bg); border: 1px solid var(--border); padding: 8px 12px; border-radius: 6px; cursor: pointer; color: var(--text); font-size: 13px; }
    </style>
</head>
<body>

    <header>
        <div>ORBIT ✦</div>
    </header>

    <!-- HALAMAN HOME -->
    <main id="view-home" class="container active">
        <div id="timelineToday"><h3>Today</h3><div class="list"></div></div>
        <div id="timelineTomorrow"><h3>Tomorrow</h3><div class="list"></div></div>
        <div id="timelineNextWeek"><h3>Next Week & Later</h3><div class="list"></div></div>
    </main>

    <!-- HALAMAN ALL TASKS -->
    <main id="view-all" class="container">
        <h3>All Tasks by Category</h3>
        <div id="allTaskList"></div>
    </main>

    <!-- HALAMAN KATEGORI (BARU) -->
    <main id="view-cats" class="container">
        <h3>Buat Kategori Baru</h3>
        <div style="background: var(--card); padding: 15px; border-radius: 12px; border: 1px solid var(--border); margin-bottom: 25px;">
            <input type="text" id="newCatName" placeholder="Nama Kategori...">
            <div style="display: flex; gap: 10px; align-items: center; margin-bottom: 15px;">
                <label style="font-size: 14px; color: var(--text);">Warna Label:</label>
                <input type="color" id="newCatColor" value="#0074D9" style="height: 40px; padding: 2px; width: 60px; margin: 0; border: none; border-radius: 4px;">
            </div>
            <button class="btn-main" onclick="addCategory()">+ Tambah Kategori</button>
        </div>
        
        <h3>Daftar Kategori Anda</h3>
        <div id="catList" style="display: flex; flex-direction: column; gap: 10px;"></div>
    </main>

    <!-- HALAMAN SETTINGS -->
    <main id="view-settings" class="container">
        <h3>Appearance</h3>
        <div class="toggle-wrap">
            <span style="font-size: 20px;">🌙</span>
            <label class="switch">
                <input type="checkbox" id="darkModeToggle" onchange="toggleDarkMode()">
                <span class="slider"></span>
            </label>
            <span style="font-size: 14px; font-weight: bold;">Dark Mode</span>
        </div>
    </main>

    <!-- NAVIGASI BAWAH BARU -->
    <nav>
        <button id="nav-home" class="nav-item active" onclick="switchView('home')"><span class="nav-icon">🏠</span> Home</button>
        <button id="nav-cats" class="nav-item" onclick="switchView('cats')"><span class="nav-icon">🏷️</span> Kategori</button>
        
        <div style="width: 20%; display: flex; justify-content: center;">
            <button class="btn-add-float" onclick="openNewTaskModal()">+</button>
        </div>
        
        <button id="nav-all" class="nav-item" onclick="switchView('all')"><span class="nav-icon">📋</span> Semua</button>
        <button id="nav-settings" class="nav-item" onclick="switchView('settings')"><span class="nav-icon">⚙️</span> Setelan</button>
    </nav>

    <!-- TASK MODAL -->
    <div id="taskModal" class="modal-overlay">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="taskModalTitle">New Task</h2>
                <button class="close-btn" onclick="closeModal('taskModal')">✕</button>
            </div>
            
            <label style="font-size: 14px; margin-bottom: 5px; display: block; font-weight: bold;">Pilih Ikon:</label>
            <div class="icon-grid" id="taskIconGrid"></div>
            
            <input type="text" id="taskInput" placeholder="Judul Tugas...">
            <textarea id="taskDesc" placeholder="Catatan tambahan..."></textarea>
            
            <label style="font-size: 14px; margin-bottom: 5px; display: block; font-weight: bold;">Waktu & Kategori:</label>
            <div style="display: flex; gap: 10px; margin-bottom: 20px;">
                <input type="datetime-local" id="taskTime" style="flex: 1; margin: 0;">
                <select id="taskCategory" style="flex: 1; margin: 0;"></select>
            </div>
            
            <button class="btn-main" onclick="saveTask()">Simpan Tugas</button>
        </div>
    </div>

    <script src="app.js?v=final"></script>
</body>
</html>
