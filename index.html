<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Tugasku Pro</title>
    <link rel="manifest" href="manifest.json">
    <style>
        :root {
            --bg: #f4f4f9; --text: #333; --card: #fff; --border: #ddd; --primary: #4CAF50;
        }
        /* Dark Mode: Black & Navy Blue */
        [data-theme="dark"] {
            --bg: #000000; --text: #e0e0e0; --card: #001f3f; --border: #003366; --primary: #0074D9;
        }
        
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
        body { background: var(--bg); color: var(--text); padding-top: 60px; padding-bottom: 70px; transition: 0.3s; }
        
        /* Header Top */
        header { position: fixed; top: 0; left: 0; right: 0; height: 60px; background: var(--card); border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; padding: 0 20px; z-index: 10; font-size: 20px; font-weight: bold; }
        .btn-settings { background: none; border: none; font-size: 24px; cursor: pointer; color: var(--text); }

        /* Bottom Navigation (Instagram Style) */
        nav { position: fixed; bottom: 0; left: 0; right: 0; height: 60px; background: var(--card); border-top: 1px solid var(--border); display: flex; justify-content: space-around; align-items: center; z-index: 10; }
        .nav-item { background: none; border: none; font-size: 16px; color: var(--text); display: flex; flex-direction: column; align-items: center; cursor: pointer; opacity: 0.5; width: 100%; height: 100%; justify-content: center; }
        .nav-item.active { opacity: 1; border-top: 3px solid var(--primary); font-weight: bold; }

        /* Main Content */
        .container { padding: 15px; max-width: 600px; margin: auto; display: none; }
        .container.active { display: block; }
        
        h3 { margin: 15px 0 10px 0; font-size: 16px; opacity: 0.8; border-bottom: 1px solid var(--border); padding-bottom: 5px; }

        /* Forms */
        .input-group { background: var(--card); padding: 15px; border-radius: 8px; border: 1px solid var(--border); margin-bottom: 15px; }
        input, select, textarea { width: 100%; padding: 10px; margin-bottom: 10px; border: 1px solid var(--border); background: var(--bg); color: var(--text); border-radius: 6px; }
        textarea { resize: vertical; min-height: 60px; }
        .btn-main { width: 100%; padding: 12px; background: var(--primary); color: white; border: none; border-radius: 6px; font-weight: bold; font-size: 16px; cursor: pointer; }
        .row { display: flex; gap: 10px; }
        .row > * { flex: 1; }
        
        /* Task Cards */
        .task-card { background: var(--card); padding: 15px; border-radius: 8px; border: 1px solid var(--border); margin-bottom: 10px; display: flex; flex-direction: column; gap: 5px; }
        .task-header { display: flex; justify-content: space-between; align-items: flex-start; }
        .task-title { font-weight: bold; font-size: 16px; display: flex; align-items: center; gap: 8px; }
        .completed .task-title { text-decoration: line-through; opacity: 0.5; }
        .task-desc { font-size: 13px; color: #aaa; margin: 5px 0; }
        .badge { font-size: 12px; padding: 4px 8px; border-radius: 12px; color: white; display: inline-flex; align-items: center; gap: 5px; }
        .task-time { font-size: 12px; font-weight: bold; color: var(--primary); }
        .actions { display: flex; gap: 10px; justify-content: flex-end; margin-top: 5px; }
        .btn-icon { background: var(--bg); border: 1px solid var(--border); padding: 6px 12px; border-radius: 6px; cursor: pointer; color: var(--text); }
    </style>
</head>
<body>

    <header>
        <div>🌙 Tugasku</div>
        <button class="btn-settings" onclick="switchView('settings')">⚙️</button>
    </header>

    <!-- HALAMAN HOME (Timeline Tugas) -->
    <main id="view-home" class="container active">
        <div id="timelineToday"><h3>Hari Ini</h3><div class="list"></div></div>
        <div id="timelineTomorrow"><h3>Besok</h3><div class="list"></div></div>
        <div id="timelineNextWeek"><h3>Minggu Depan & Nanti</h3><div class="list"></div></div>
    </main>

    <!-- HALAMAN SEMUA TUGAS (Tambah & Edit) -->
    <main id="view-all" class="container">
        <div class="input-group">
            <div class="row">
                <input type="text" id="taskIcon" placeholder="Ikon (Emoji)" maxlength="2" style="flex: 0.3; text-align: center;">
                <input type="text" id="taskInput" placeholder="Judul Tugas...">
            </div>
            <textarea id="taskDesc" placeholder="Catatan/Deskripsi..."></textarea>
            <div class="row">
                <input type="datetime-local" id="taskTime">
                <select id="taskCategory"></select>
            </div>
            <button class="btn-main" onclick="addTask()">+ Tambah Tugas</button>
        </div>
        <h3>Daftar Semua Tugas</h3>
        <div id="allTaskList"></div>
    </main>

    <!-- HALAMAN PENGATURAN -->
    <main id="view-settings" class="container">
        <h3>Pengaturan Aplikasi</h3>
        <div class="input-group">
            <label style="display: flex; align-items: center; gap: 10px; font-size: 16px;">
                <input type="checkbox" id="darkModeToggle" onchange="toggleDarkMode()" style="width: 24px; height: 24px; margin: 0;"> 
                Gunakan Dark Mode (Black/Navy)
            </label>
        </div>
        
        <h3>Kategori Tugas</h3>
        <div class="input-group">
            <div class="row">
                <input type="text" id="newCatIcon" placeholder="Ikon (Emoji)" maxlength="2" style="flex: 0.3; text-align: center;">
                <input type="text" id="newCatName" placeholder="Nama Kategori Baru">
            </div>
            <input type="color" id="newCatColor" value="#0074D9" style="height: 40px; padding: 2px;">
            <button class="btn-main" onclick="addCategory()">Buat Kategori</button>
        </div>
        <div id="catList" style="display: flex; flex-direction: column; gap: 10px;"></div>
    </main>

    <nav>
        <button id="nav-home" class="nav-item active" onclick="switchView('home')">
            <span style="font-size: 20px;">🏠</span> Home
        </button>
        <button id="nav-all" class="nav-item" onclick="switchView('all')">
            <span style="font-size: 20px;">📋</span> Semua Tugas
        </button>
    </nav>

    <script src="app.js"></script>
</body>
</html>
